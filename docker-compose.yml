services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "1518"
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-p1518"]
      interval: 10s
      timeout: 5s
      retries: 20

  config-server:
    build: ./config-server
    ports: ["8888:8888"]
    volumes: ["./config-repo:/config-repo"]
    environment:
      CONFIG_REPO_PATH: file:/config-repo

  service-registry:
    build: ./service-registry
    ports: ["8761:8761"]

  auth-service:
    build: ./auth-service
    ports: ["8081:8081"]
    depends_on:
      mysql: {condition: service_healthy}
      service-registry: {condition: service_started}
      config-server: {condition: service_started}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/foodresq_auth?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: "1518"
      EUREKA_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888

  donor-service:
    build: ./donor-service
    ports: ["8082:8082"]
    depends_on:
      mysql: {condition: service_healthy}
      service-registry: {condition: service_started}
      config-server: {condition: service_started}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/foodresq_donor?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: "1518"
      EUREKA_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888

  recipient-service:
    build: ./recipient-service
    ports: ["8083:8083"]
    depends_on:
      mysql: {condition: service_healthy}
      service-registry: {condition: service_started}
      config-server: {condition: service_started}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/foodresq_recipient?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: "1518"
      EUREKA_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888

  donation-service:
    build: ./donation-service
    ports: ["8084:8084"]
    depends_on:
      mysql: {condition: service_healthy}
      service-registry: {condition: service_started}
      config-server: {condition: service_started}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/foodresq_donation?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: "1518"
      EUREKA_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888

  matching-service:
    build: ./matching-service
    ports: ["8085:8085"]
    depends_on:
      mysql: {condition: service_healthy}
      service-registry: {condition: service_started}
      config-server: {condition: service_started}
      ml-service: {condition: service_started}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/foodresq_matching?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: "1518"
      EUREKA_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      ML_SERVICE_URL: http://ml-service:8090

  logistics-service:
    build: ./logistics-service
    ports: ["8086:8086"]
    depends_on:
      mysql: {condition: service_healthy}
      service-registry: {condition: service_started}
      config-server: {condition: service_started}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/foodresq_logistics?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: "1518"
      EUREKA_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888

  notification-service:
    build: ./notification-service
    ports: ["8087:8087"]
    depends_on:
      mysql: {condition: service_healthy}
      service-registry: {condition: service_started}
      config-server: {condition: service_started}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/foodresq_notification?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: "1518"
      EUREKA_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888


  ml-service:
    build: ./ml-service
    ports: ["8090:8090"]

  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on:
      api-gateway:
        condition: service_started
    environment:
      VITE_API_PROXY_TARGET: http://api-gateway:8080

volumes:
  mysql_data:
